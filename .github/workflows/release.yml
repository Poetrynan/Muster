name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.2.5)"
        required: true
        default: "v0.2.5"
      platform:
        description: "Platforms to build"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "macos-arm"
          - "macos-intel"
          - "windows"
          - "linux"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the source and find or create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          git check-ref-format "$tag_ref"
          # Prefer the published release during a repair. If all matches are
          # drafts from an older run, reuse the one with the most assets.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp |
            jq -c --arg tag "$RELEASE_TAG" '
              flatten | map(select(.tag_name == $tag))
              | sort_by(.draft, -(.assets | length), .id) | first // empty
            ')
          source_sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            remote_tag=$(git ls-remote --refs origin "$tag_ref")
            if [ -n "$remote_tag" ]; then
              git fetch --no-tags origin "$tag_ref"
              source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
            elif [ -n "$release" ]; then
              target=$(jq -er '.target_commitish' <<< "$release")
              if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::The draft for $RELEASE_TAG has no fixed commit. Push its intended tag before building again."
                exit 1
              fi
              git fetch --no-tags origin "$target"
              source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
            fi
          fi

          version=$(git show "${source_sha}:src-tauri/tauri.conf.json" | jq -er '.version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match app version $version at $source_sha"
            exit 1
          fi

          if [ -z "$release" ]; then
            if git cat-file -e "${source_sha}:RELEASE_NOTES.md" 2>/dev/null; then
              git show "${source_sha}:RELEASE_NOTES.md" |
                awk '/^# Muster v/ { n++ } n <= 1 { print }' > "$RUNNER_TEMP/release-notes.md"
            else
              echo "See the assets below to download Muster for your platform." > "$RUNNER_TEMP/release-notes.md"
            fi
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --method POST \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$source_sha" \
              -f name="Muster $RELEASE_TAG" -F body="@$RUNNER_TEMP/release-notes.md" \
              -F draft=true)
          fi

          release_id=$(jq -er '.id' <<< "$release")
          echo "Building $source_sha for $RELEASE_TAG (release ID $release_id)"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "published=$(jq -r '.draft | not' <<< "$release")" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app` MUST stay in the macOS bundle list.
          #
          # The macOS updater artifact is a `.app.tar.gz` built from the `.app`
          # bundle, and tauri-bundler only creates it when `app` is among the
          # *requested* targets:
          #
          #   if package_types.contains(&PackageType::MacOsBundle) || has_v1_target {
          #       updater_bundle::bundle_project(...)   // -> .app.tar.gz + .sig
          #   } else {
          #       log::warn!("... enable one of these targets: app, appimage, deb, rpm, msi, nsis")
          #   }
          #
          # (`createUpdaterArtifacts: true` is the v2 mode, so `has_v1_target` is
          # false — the `app` target is the only thing that can satisfy this.)
          #
          # Shipping `--bundles dmg` alone produced DMGs with no updater
          # artifact. tauri-action collects artifacts by existence, so it
          # silently skipped them and latest.json came out with no `darwin-*`
          # key — every macOS install then failed to update with:
          #   None of the fallback platforms '["darwin-aarch64-app",
          #   "darwin-aarch64"]' were found in the response 'platforms' object
          # The bundler also deletes the .app when it is not requested, so the
          # only trace of the mistake is one warning line in the build log.
          - id: "macos-arm"
            platform: "macos-15"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - id: "macos-intel"
            platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - id: "windows"
            platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles msi,nsis"
          - id: "linux"
            platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Protect existing public updater bundles
        id: public-assets
        if: ${{ needs.prepare-release.outputs.published == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
          PLATFORM: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          case "$PLATFORM" in
            macos-arm) bundles=("Muster_aarch64.app.tar.gz") ;;
            macos-intel) bundles=("Muster_x64.app.tar.gz") ;;
            windows) bundles=("Muster_${version}_x64-setup.exe" "Muster_${version}_x64_en-US.msi") ;;
            linux) bundles=("Muster_${version}_amd64.AppImage" "Muster_${version}_amd64.deb") ;;
          esac
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate --jq '.[] | select(.state == "uploaded") | .name')
          present=0
          for bundle in "${bundles[@]}"; do
            for name in "$bundle" "$bundle.sig"; do
              if grep -Fxq "$name" <<< "$names"; then
                present=$((present + 1))
              fi
            done
          done
          if [ "$present" -eq "$((${#bundles[@]} * 2))" ]; then
            echo "Reusing existing public updater bundles for $PLATFORM"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -ne 0 ]; then
            echo "::error::The public $RELEASE_TAG has incomplete updater assets for $PLATFORM. Restore the matching files from the original build or release a new version."
            exit 1
          fi

      - name: Checkout repository
        if: ${{ steps.public-assets.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source-sha }}

      - name: Install Linux dependencies
        if: ${{ steps.public-assets.outputs.skip != 'true' && runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        if: ${{ steps.public-assets.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        if: ${{ steps.public-assets.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: ${{ steps.public-assets.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        if: ${{ steps.public-assets.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        run: npm ci

      - name: Build Tauri app
        if: ${{ steps.public-assets.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key pair for the updater. Without these the build still succeeds
          # but produces no .sig files, and the updater would reject every artifact.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # The macOS updater archive is the exact artifact whose absence stranded
      # every Mac user (see the matrix comment above). Asserting it here is more
      # direct than reading the manifest back: it runs in the leg that built it,
      # needs no token, and cannot be confused by draft-release visibility.
      - name: Assert the macOS updater artifact was produced
        if: ${{ steps.public-assets.outputs.skip != 'true' && startsWith(matrix.id, 'macos') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        shell: bash
        run: |
          set -euo pipefail
          base="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          echo "contents of $base:"
          ls -la "$base" || true
          for f in "Muster.app.tar.gz" "Muster.app.tar.gz.sig"; do
            if [ ! -f "$base/$f" ]; then
              echo "::error::$base/$f is missing — without it macOS cannot auto-update"
              exit 1
            fi
            echo "  ok  $f"
          done

  # Only this job writes latest.json, after all selected builds have finished.
  verify-updater-manifest:
    needs: [prepare-release, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and verify latest.json for every supported platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        run: python3 .github/scripts/generate_updater_manifest.py
