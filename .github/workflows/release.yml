name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.7)"
        required: true
        default: "v0.1.7"
      platform:
        description: "Platforms to build"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "macos-intel"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "macos-arm"
            platform: "macos-15"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin --bundles dmg"
          - id: "macos-intel"
            platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin --bundles dmg"
          - id: "windows"
            platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles msi,nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        run: npm ci

      - name: Read Release Notes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        id: release_notes
        shell: bash
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            EOF=$(openssl rand -hex 8)
            echo "notes<<$EOF" >> $GITHUB_OUTPUT
            cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=See the assets below to download Muster for your platform." >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key pair for the updater. Without these the build still succeeds
          # but produces no .sig files, and the updater would reject every artifact.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Muster ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Windows ships both .msi and NSIS .exe, but latest.json holds a single
          # windows-x86_64 entry. Default picks the MSI, which would make an
          # NSIS-installed app (per-user, under AppData) update itself into a
          # second per-machine install with its own uninstaller. Prefer NSIS.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
