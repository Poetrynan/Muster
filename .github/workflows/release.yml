name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.2.5)"
        required: true
        default: "v0.2.5"
      platform:
        description: "Platforms to build"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "macos-arm"
          - "macos-intel"
          - "windows"
          - "linux"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app` MUST stay in the macOS bundle list.
          #
          # The macOS updater artifact is a `.app.tar.gz` built from the `.app`
          # bundle, and tauri-bundler only creates it when `app` is among the
          # *requested* targets:
          #
          #   if package_types.contains(&PackageType::MacOsBundle) || has_v1_target {
          #       updater_bundle::bundle_project(...)   // -> .app.tar.gz + .sig
          #   } else {
          #       log::warn!("... enable one of these targets: app, appimage, deb, rpm, msi, nsis")
          #   }
          #
          # (`createUpdaterArtifacts: true` is the v2 mode, so `has_v1_target` is
          # false — the `app` target is the only thing that can satisfy this.)
          #
          # Shipping `--bundles dmg` alone produced DMGs with no updater
          # artifact. tauri-action collects artifacts by existence, so it
          # silently skipped them and latest.json came out with no `darwin-*`
          # key — every macOS install then failed to update with:
          #   None of the fallback platforms '["darwin-aarch64-app",
          #   "darwin-aarch64"]' were found in the response 'platforms' object
          # The bundler also deletes the .app when it is not requested, so the
          # only trace of the mistake is one warning line in the build log.
          - id: "macos-arm"
            platform: "macos-15"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - id: "macos-intel"
            platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - id: "windows"
            platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles msi,nsis"
          - id: "linux"
            platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        run: npm ci

      - name: Read Release Notes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        id: release_notes
        shell: bash
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            EOF=$(openssl rand -hex 8)
            echo "notes<<$EOF" >> $GITHUB_OUTPUT
            # Only the newest section. RELEASE_NOTES.md keeps every past version,
            # and `cat` used to paste all of them into the release body, so the
            # v0.1.8 page carried the notes of v0.1.2 through v0.1.7 as well.
            awk '/^# Muster v/ { n++ } n > 1 { exit } { print }' RELEASE_NOTES.md >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=See the assets below to download Muster for your platform." >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.id }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key pair for the updater. Without these the build still succeeds
          # but produces no .sig files, and the updater would reject every artifact.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Muster ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Windows ships both .msi and NSIS .exe, but latest.json holds a single
          # windows-x86_64 entry. Default picks the MSI, which would make an
          # NSIS-installed app (per-user, under AppData) update itself into a
          # second per-machine install with its own uninstaller. Prefer NSIS.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # A release only ships if every supported platform can actually update itself.
  #
  # This job exists because the opposite shipped once: macOS DMGs were built and
  # published while latest.json carried no `darwin-*` key, so every Apple Silicon
  # user hit
  #   None of the fallback platforms '["darwin-aarch64-app", "darwin-aarch64"]'
  #   were found in the response 'platforms' object
  # with no way forward short of downloading a DMG by hand.
  #
  # Each platform build succeeds in isolation, so nothing in the matrix could
  # notice — the manifest is the only place the gap is visible. Checking it here
  # turns a silent, user-facing dead end into a red workflow.
  verify-updater-manifest:
    needs: build-and-release
    # Run even when a leg failed: a missing platform is exactly what we need to
    # hear about, and a failed leg is a likely cause of it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Deliberately inherits the workflow-level `contents: write` rather than
    # narrowing to `read`: the release is a *draft*, and drafts are only visible
    # with push access. A read-only token gets a 404 here and the check would
    # fail for the wrong reason. The job only ever downloads.
    steps:
      - name: Assert latest.json covers every supported platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          # The release is a draft, so the public download URL is not readable
          # without a token — go through the API instead. `gh` drops the file in
          # the working directory; there is no --output flag on this command.
          for attempt in $(seq 1 10); do
            rm -f latest.json
            if gh release download "$tag" --pattern latest.json --clobber 2>/dev/null && [ -s latest.json ]; then
              echo "fetched latest.json from the $tag release"
              break
            fi
            echo "latest.json not on the release yet (attempt $attempt)"
            sleep 30
          done
          if [ ! -s latest.json ]; then
            echo "::error::no latest.json asset found on release $tag — the updater has nothing to read"
            exit 1
          fi

          # darwin-* is the pair that regressed and stranded Apple users; the
          # others are here so no platform can be dropped silently either.
          missing=0
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            if python3 -c "import json,sys; sys.exit(0 if '$key' in json.load(open('latest.json')).get('platforms',{}) else 1)"; then
              echo "  ok      $key"
            else
              echo "::error::latest.json has no '$key' entry — that platform cannot auto-update"
              missing=1
            fi
          done
          exit $missing
