<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muster</title>
    <!--
      Paint the correct background BEFORE any CSS module or JS runs, so the
      WebView never shows a white flash while the bundle cold-starts.

      The boot screen is fixed pure white (minimal: centered LOGO); the `dark` class is
      taken over by the main UI theme only after React mounts, and is unrelated to the boot screen.
    -->
    <script>
      (function () {
        try {
          var stored = null;
          var raw = localStorage.getItem("muster-settings");
          if (raw)
            stored = (((JSON.parse(raw) || {}).state) || {}).settings || {};
          stored = stored.darkMode;
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        // The boot screen is fixed pure white (decoupled from the theme); the dark class is for the main UI theme.
        var bg = "#FFFFFF";
        document.documentElement.style.backgroundColor = bg;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <!-- Global error capture: show any unhandled error on the page, to avoid a "black screen with no clue why".
         Without it, once React fails to mount or JS throws, the user just sees a blank page. -->
    <script>
      (function () {
        // ========== Boot Trace ==========
        // Purpose: open up the black box of "black screen after launch / slow loading".
        // Each milestone is logged to both the browser console and the Rust-side boot.log (stdout + disk).
        //
        // The Rust-side command `dev_log(stage, detail)` is async IPC; the tauri global may not be ready yet
        // when this script runs, so entries are queued in `__bootQueue` first and flushed all at once once
        // `window.__TAURI__` appears. Losing a report or two is fine — console.log is the fallback.
        var t0 = Date.now();
        var __bootQueue = [];
        function mark(stage, detail) {
          var dt = Date.now() - t0;
          var line = "[boot +" + dt + "ms] " + stage + (detail ? " — " + detail : "");
          try { console.log(line); } catch (_) {}
          __bootQueue.push([stage, "+" + dt + "ms " + (detail || "")]);
          flushIfReady();
        }
        function flushIfReady() {
          var tauri = window.__TAURI__ && window.__TAURI__.core;
          var invoke = tauri && tauri.invoke;
          if (!invoke) return;
          var q = __bootQueue;
          __bootQueue = null; // mark as flushed; afterwards mark() invokes directly
          for (var i = 0; i < q.length; i++) {
            try { invoke("dev_log", { stage: q[i][0], detail: q[i][1] }); } catch (_) {}
          }
          // subsequent mark() calls invoke directly, no longer queuing
          var origMark = mark;
          mark = function (stage, detail) {
            var dt = Date.now() - t0;
            var line = "[boot +" + dt + "ms] " + stage + (detail ? " — " + detail : "");
            try { console.log(line); } catch (_) {}
            try { invoke("dev_log", { stage: stage, detail: "+" + dt + "ms " + (detail || "") }); } catch (_) {}
          };
          window.__bootMark = mark;
        }
        window.__bootMark = mark;
        // Probe every 100ms whether tauri is available, up to 5s (in production mode it is available almost immediately;
        // dev mode is occasionally slower, but still flushes before React mounts).
        var probeStart = Date.now();
        var probe = setInterval(function () {
          if (window.__TAURI__) { flushIfReady(); clearInterval(probe); return; }
          if (Date.now() - probeStart > 5000) clearInterval(probe);
        }, 100);

        mark("html-parsed", "userAgent=" + (navigator.userAgent || "").slice(0, 60));

        function show(kind, msg, stack) {
          try {
            mark("js-" + kind, msg);
            var el = document.getElementById("__fatal_err__");
            if (!el) {
              el = document.createElement("div");
              el.id = "__fatal_err__";
              el.style.cssText =
                "position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;" +
                "z-index:99999;padding:14px 16px;font:12px/1.5 Consolas,ui-monospace,monospace;" +
                "background:rgba(220,38,38,0.95);color:#fff;box-shadow:0 -4px 16px rgba(0,0,0,0.5);" +
                "border-top:2px solid #FBBF24;white-space:pre-wrap;word-break:break-word;";
              document.body.appendChild(el);
            }
            el.textContent += "[" + kind + "] " + msg + (stack ? "\n" + stack : "") + "\n\n";
          } catch (_) {}
        }
        window.addEventListener("error", function (e) {
          show("error", (e.message || "unknown") + " @ " + (e.filename || "") + ":" + (e.lineno || 0),
               e.error && e.error.stack);
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("unhandledrejection",
               (r && (r.message || r.toString())) || String(r),
               r && r.stack);
        });
        // DOM interactive / fully loaded: two official W3C lifecycle events, used to pinpoint the "HTML to JS" gap.
        document.addEventListener("readystatechange", function () {
          mark("readystate-" + document.readyState);
        });
        window.addEventListener("DOMContentLoaded", function () { mark("DOMContentLoaded"); });
        window.addEventListener("load", function () { mark("window-load"); });

        // Loading progress hint (not an error): in dev mode Vite has to transpile hundreds of modules on demand,
        // so a 10~30s cold start is normal. Only hint after 30s without a mount, to avoid being misleading.
        var __tick = setInterval(function () {
          // The check is now "is the boot screen still in the DOM": React mounting replaces #root entirely,
          // at which point #__boot__ disappears. More robust than matching the copy (which would break if the copy changes).
          if (!document.getElementById("__boot__")) { clearInterval(__tick); return; }
          var sec = Math.round((Date.now() - t0) / 1000);
          if (sec < 30) return;
          clearInterval(__tick);
          var el = document.getElementById("__slow_hint__");
          if (!el) {
            el = document.createElement("div");
            el.id = "__slow_hint__";
            el.style.cssText =
              "position:fixed;left:0;right:0;bottom:0;z-index:99998;padding:12px 16px;" +
              "font:12px/1.6 Consolas,ui-monospace,monospace;background:rgba(30,58,95,0.95);" +
              "color:#CBD5E1;border-top:1px solid rgba(255,255,255,0.15);";
            document.body.appendChild(el);
          }
          el.textContent =
            "已等待 " + sec + "s 仍在加载。dev 模式首次冷启动需转译全部模块，属正常，请继续等待。" +
            "若长时间无响应，按 F12 查看 Console / Network。生产构建（npm run tauri build）不存在此开销。";
        }, 1000);
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background-color: #FFFFFF; overflow: hidden; }

      /* ==========================================================
         Boot Screen — minimal version
         Pure white background + centered LOGO, no animation, fades out after a 2s minimum display.
         The logo is inline base64: zero external requests, zero JS dependencies.
         ========================================================== */
      #__boot__ {
        position: fixed; inset: 0; z-index: 9997;
        display: flex; align-items: center; justify-content: center;
        background: #FFFFFF;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      .boot-stack {
        position: relative; z-index: 2;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }

      .boot-logo {
        width: 84px; height: 84px; object-fit: contain;
        border-radius: 14px;
      }

      .boot-title {
        margin-top: 16px;
        font-size: 18px; font-weight: 600;
        letter-spacing: -0.01em;
        color: #02182B;
        animation: bootFadeIn 0.4s ease-out both;
      }
      @keyframes bootFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Wrap-up: React mounts → whole screen fades out after 2s → removed */
      #__boot__.boot-done {
        opacity: 0;
        transition: opacity 320ms ease-out;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #__boot__, #__boot__ * { transition-duration: 0.01ms; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>

    <script>
      // Minimal boot screen wrap-up.
      // window.__bootDone() is called by App.tsx on the first frame: after 2s the whole screen fades out and the node is removed.
      (function () {
        var finished = false;
        var bootStart = Date.now();
        var MIN_SHOW = 2000; // minimum boot screen display time: 2s
        window.__bootDone = function () {
          if (finished) return;
          finished = true;
          if (window.__bootMark) window.__bootMark("boot-done", "React first paint signalled");
          var run = function () {
            var boot = document.getElementById("__boot__");
            if (!boot) return;
            boot.classList.add("boot-done");
            setTimeout(function () {
              if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
            }, 500);
          };
          var elapsed = Date.now() - bootStart;
          if (elapsed >= MIN_SHOW) run();
          else setTimeout(run, MIN_SHOW - elapsed);
        };
      })();
    </script>
